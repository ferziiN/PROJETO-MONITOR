# =============================================================================
# Configuração do Nginx — Projeto Monitor
# - Serve os arquivos estáticos do Front-end (src/frontend)
# - Atua como Proxy Reverso para a API .NET (/api e /health)
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Logs de acesso e erro
    access_log /var/log/nginx/monitor_access.log;
    error_log  /var/log/nginx/monitor_error.log warn;

    # Compressão Gzip para assets estáticos e respostas JSON
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # Redireciona a raiz diretamente para o Dashboard
    location = / {
        return 302 /pages/dashboard.html;
    }

    # Arquivos estáticos do Front-end (HTML, CSS, JS, Assets)
    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy Reverso para os endpoints REST da API
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Proxy Reverso para o Health Check da API + Banco
    location = /health {
        proxy_pass         http://api:8080/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
}
